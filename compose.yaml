
services:
  # 1. Next.js Frontend
  spotify-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-webapp
    ports:
      - "3000:3000"
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-apdl_default"
      - "traefik.http.routers.spotify.rule=Host(`audioram.tech`) || Host(`www.audioram.tech`)"
      - "traefik.http.routers.spotify.entrypoints=websecure"
      - "traefik.http.routers.spotify.tls=true"
      - "traefik.http.routers.spotify.tls.certresolver=letsencrypt"
      - "traefik.http.services.spotify.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://spotify-backend:3001/api
    restart: unless-stopped

  # 2. NestJS Backend
  spotify-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify-backend
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001

      # PostgreSQL connection
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis connection
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-apdl_default"
      - "traefik.http.routers.spotify-api.rule=(Host(`audioram.tech`) || Host(`www.audioram.tech`)) && PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.spotify-api.entrypoints=websecure"
      - "traefik.http.routers.spotify-api.priority=100"
      - "traefik.http.routers.spotify-api.tls=true"
      - "traefik.http.routers.spotify-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.spotify-api.service=spotify-api"
      - "traefik.http.services.spotify-api.loadbalancer.server.port=3001"
    networks:
      - default
      - traefik-public
    restart: unless-stopped

  # 3. PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: spotify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


# Persistent database storage
volumes:
  postgres_data:
  redis_data:

networks:
  traefik-public:
    external: true
    name: n8n-apdl_default
